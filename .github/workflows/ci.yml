name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository; nothing here needs write access.
permissions:
  contents: read

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Must come BEFORE setup-node: the npm/pnpm cache resolves the store
      # path by invoking pnpm, so pnpm has to already be on PATH. The version
      # is read from `packageManager` in package.json — never duplicated here.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Each check reports even when an earlier one failed, so a single run
      # surfaces every problem instead of one per push. `!cancelled()` rather
      # than `always()`: a cancelled run should stop, not keep burning minutes.
      - name: ESLint
        run: pnpm lint

      - name: Prettier
        if: ${{ !cancelled() }}
        run: pnpm format:check

      - name: TypeScript
        if: ${{ !cancelled() }}
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Vitest
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Built the same way on every event, pull requests included: a base-path
      # mistake has to fail in review, not on the live site.
      - name: Build
        run: pnpm build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    # Nothing reaches the live site until lint, tests and the build are green.
    needs: [lint, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Job-scoped, and it REPLACES the workflow-level `contents: read` rather
    # than adding to it — deploy-pages needs exactly these two.
    permissions:
      pages: write
      id-token: write

    # Its own group, and deliberately NOT cancel-in-progress: cancelling a
    # deploy midway can leave the site half-published.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
