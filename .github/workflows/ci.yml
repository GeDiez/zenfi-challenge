name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository; nothing here needs write access.
permissions:
  contents: read

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Must come BEFORE setup-node: the npm/pnpm cache resolves the store
      # path by invoking pnpm, so pnpm has to already be on PATH. The version
      # is read from `packageManager` in package.json — never duplicated here.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Each check reports even when an earlier one failed, so a single run
      # surfaces every problem instead of one per push. `!cancelled()` rather
      # than `always()`: a cancelled run should stop, not keep burning minutes.
      - name: ESLint
        run: pnpm lint

      - name: Prettier
        if: ${{ !cancelled() }}
        run: pnpm format:check

      - name: TypeScript
        if: ${{ !cancelled() }}
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Vitest
        run: pnpm test
