name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository; nothing here needs write access.
permissions:
  contents: read

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Each check reports even when an earlier one failed, so a single run
      # surfaces every problem instead of one per push. `!cancelled()` rather
      # than `always()`: a cancelled run should stop, not keep burning minutes.
      - name: ESLint
        run: npm run lint

      - name: TypeScript
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Prettier
        if: ${{ !cancelled() }}
        run: npm run format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Vitest
        run: npm test
